name: Publish Studio interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify static-only publish directory
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed = {'.html', '.js', '.css', '.svg', '.png', '.jpg', '.webp', '.woff', '.woff2'}
          root = Path('site')
          for p in root.rglob('*'):
              if p.is_symlink():
                  raise SystemExit(f'Symlink is not a static asset: {p}')
              if p.is_file() and p.name != '.nojekyll' and p.suffix not in allowed:
                  raise SystemExit(f'Unexpected publish file: {p}')
          for name in ('index.html', 'editor.html', 'images.html', 'web-client.js', 'web-client.css'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing interface file: {name}')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
